# SiGMA-lite with the TU recipe of Tables 17 and 18 of the SiGMA paper (LoG 2026):
# a2g4 (2 vanilla attention heads + GCN, GIN, SAGE, GAT MP heads), L=12, H=64,
# random 50/25/25 split, base_lr in {1e-3, 1e-2}, 5 seeds.
# d_h=16 is Table 17; set gnn.hybrid.d_h 4 for Table 18 (~1x GCN parameters).
# Heads are ungated; one gate (gnn.sigma_lite.gate_act) acts on the mixed update.
# Override dataset.name for other TU datasets (MUTAG, ENZYMES, PROTEINS, ...).
out_dir: results/sigma_lite_tu
metric_best: accuracy
metric_agg: argmax
wandb:
  use: False
  project: GNNPlus
dataset:
  format: PyG-TUDataset
  name: MUTAG
  task: graph
  task_type: classification
  transductive: False
  split_mode: random
  split: [0.5, 0.25, 0.25]
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  # The MP heads and vanilla attention used here ignore edge features.
  edge_encoder: False
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  enable_ckpt: False
  eval_smoothing_metrics: False
model:
  type: sigma_lite
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: default
  layers_mp: 12
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 64
  act: relu
  dropout: 0.1
  agg: mean
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 4
    d_h: 16
    attn_type: vanilla
    attn_mask: full
    norm: layernorm
    gnn_types: "GCN,GIN,SAGE,GAT"
    attn_dropout: 0.1
    mp_dropout: 0.1
    block_bn: False
    residual: True
    log_gate_stats: True
  sigma_lite:
    gate_act: sigmoid
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  min_lr: 0.0
  max_epoch: 1000
  scheduler: reduce_on_plateau
  reduce_factor: 0.5
  schedule_patience: 50
  num_warmup_epochs: 0
