# TU graph classification — SiGMA homogeneous MP heads (a2g4).
#
# Same #MP heads as hetero (4), but all GCN:
#   num_attn_heads=2, num_gnn_heads=4, gnn_types=GCN,GCN,GCN,GCN
#
# Shared train recipe with gcn-anchor.yaml / sigma-hetero-a2g4-anchor.yaml.
# Launch script overrides dataset.name and optim.base_lr ∈ {0.001, 0.01}.
out_dir: results/tu_sigma_homo_hetero
metric_best: accuracy
metric_agg: argmax
wandb:
  use: False
  project: GNNPlus
  entity: weber-geoml-harvard-university
  group: ''
  name: ''
dataset:
  format: PyG-TUDataset
  name: ENZYMES
  task: graph
  task_type: classification
  transductive: False
  split_mode: random
  split: [0.5, 0.25, 0.25]
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: False
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  # Best-val ckpt kept for per-graph gate dump after training.
  ckpt_period: 100
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: default
  layers_mp: 12
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 64
  act: relu
  dropout: 0.1
  agg: mean
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 4
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCN,GCN,GCN,GCN"
    attn_dropout: 0.1
    mp_dropout: 0.1
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  min_lr: 0.0
  max_epoch: 1000
  scheduler: reduce_on_plateau
  reduce_factor: 0.5
  schedule_patience: 50
  num_warmup_epochs: 0
