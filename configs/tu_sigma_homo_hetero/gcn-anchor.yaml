# TU graph classification — standalone GCN baseline (shared recipe).
#
# Hyperparam sources (shared with SiGMA homo/hetero anchors):
#   - Xu et al. ICLR 2019 / powerful-gnns (arXiv:1810.00826):
#       H=64, Adam-family, WD=0, StepLR×0.5 / 50ep recipe → here plateau,
#       dropout & sum/mean pool adapted for deep L12.
#   - Dwivedi et al. Benchmarking GNNs (TU GCN notebook):
#       init_lr≈5e-4–1e-3, residual, LN/BN; we use base_lr=1e-3.
#   - Depth/width L12/H64 from ENZYMES SiGMA ogpkubk9 (gate-viz) so GCN
#     matches SiGMA depth for a fair capacity-controlled comparison.
#
# Dataset.name is overridden by the launch script.
out_dir: results/tu_sigma_homo_hetero
metric_best: accuracy
metric_agg: argmax
wandb:
  use: False
  project: GNNPlus
  entity: weber-geoml-harvard-university
  group: ''
  name: ''
dataset:
  format: PyG-TUDataset
  name: ENZYMES
  task: graph
  task_type: classification
  transductive: False
  # Match Heterogeneity_Profile / ogpkubk9 (not 10-fold CV).
  split_mode: random
  split: [0.5, 0.25, 0.25]
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: False
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  # Keep best-val model for reload (gate dump N/A for plain GCN).
  ckpt_period: 100
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
  eval_smoothing_metrics: False
model:
  type: custom_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: default
  layer_type: gcn
  layers_mp: 12
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 64
  act: relu
  dropout: 0.1
  agg: mean
  ffn: True
  residual: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  min_lr: 0.0
  max_epoch: 1000
  scheduler: reduce_on_plateau
  reduce_factor: 0.5
  schedule_patience: 50
  num_warmup_epochs: 0
