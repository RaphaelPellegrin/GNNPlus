# CLUSTER standalone GRIT + RRWP (Ma et al., ICML 2023 official config).
out_dir: results
metric_best: accuracy-SBM
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - grit
    - cluster
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CLUSTER
  task: graph
  task_type: classification
  transductive: False
  split_mode: standard
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
posenc_RRWP:
  enable: True
  ksteps: 32
  add_identity: True
  add_node_attr: False
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: GritTransformer
  loss_fun: weighted_cross_entropy
  edge_decoding: dot
gt:
  layer_type: GritTransformer
  layers: 16
  n_heads: 8
  dim_hidden: 48
  dropout: 0.01
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True
  attn:
    clamp: 5.0
    act: relu
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
gnn:
  dim_edge: 48
  head: inductive_node
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 48
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.001
  max_epoch: 100
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
