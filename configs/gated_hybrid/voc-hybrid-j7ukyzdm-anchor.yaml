# VOC-SP hybrid anchor — frozen hyperparams from W&B j7ukyzdm (seed 0).
#
# Repro commit: 5f30e22107510047fdad90910bf343fdf7b44c96
# Paper repro: 5 seeds via submit_voc_hybrid_j7ukyzdm_paper_repro.sh
# W&B group: paper_bestmodel_v1_voc_j7ukyzdm | tags: paper_repro, bestmodel_v1
#
# Architecture: 2×attention + 2×GATEDGCN MP (a2g2+RWSE), d_h=64, headwise gate, FFN on.
out_dir: results
metric_best: f1
num_workers: 6
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v1_voc_j7ukyzdm
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v1
    - voc
    - anchor_j7ukyzdm
    - hybrid_a2g2
    - gate_headwise
    - rwse
dataset:
  format: PyG-VOCSuperpixels
  name: edge_wt_region_boundary
  slic_compactness: 30
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: VOCNode+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: VOCEdge
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 8
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: True
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
gnn:
  head: inductive_node
  ffn: True
  layers_pre_mp: 0
  layers_mp: 16
  layers_post_mp: 1
  dim_inner: 95
  act: gelu
  residual: True
  dropout: 0.1
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 2
    d_h: 64
    attn_mask: full
    gate: headwise
    norm: rmsnorm
    gnn_types: "GATEDGCN,GATEDGCN"
    attn_dropout: 0.1
    mp_dropout: 0.15
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.00030671340415785184
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
