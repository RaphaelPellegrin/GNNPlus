# ZINC hybrid: 1×attention + 1×GRIT MP head (paper GRIT hyperparams at d_h=64).
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - grit
    - zinc_grit_repro_a1g1
dataset:
  format: PyG-ZINC
  name: subset
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode+RWSE
  node_encoder_num_types: 21
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: add
gnn:
  head: san_graph
  ffn: False
  layers_mp: 10
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64
  act: relu
  dropout: 0.0
  agg: mean
  residual: True
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 64
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GRIT"
    attn_dropout: 0.2
    mp_dropout: 0.0
    block_bn: false
  grit:
    n_heads: 8
    dropout: 0.0
    attn_dropout: 0.2
    layer_norm: False
    batch_norm: True
    residual: True
    norm_e: True
    update_e: False
    act: relu
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.001
  max_epoch: 2000
  scheduler: cosine_with_warmup
  num_warmup_epochs: 50
  min_lr: 1e-6
