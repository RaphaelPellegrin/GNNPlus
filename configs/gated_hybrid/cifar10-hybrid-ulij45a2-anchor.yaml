# CIFAR10 hybrid anchor — frozen from paper_bestmodel_v1_cifar10_ulij45a2.
#
# Exemplar run: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/3tx560wq
#   (seed1, job25310487; group mean Acc 79.528 ± 0.175 over 5 seeds)
# Reproduce CLI cfg path (W&B): configs/gated_hybrid/cifar10-hybrid-ulij45a2-anchor.yaml
# Commit on original job: 3b020d800ead25fd37ff083cd0f4442b07195b42
#
# Architecture: a8g4 — 8×attn + 4×GATEDGCN (types string "GATEDGCN" repeated),
#   d_h=256, headwise gate, LN, L10/H35, ep=400, lr≈4.664e-4.
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v1_cifar10_ulij45a2
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v1
    - cifar10
    - anchor_ulij45a2
    - hybrid_a8g4
    - gate_headwise
    - gatedgcn
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CIFAR10
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: LinearEdge
  edge_encoder_bn: False
posenc_RWSE:
  enable: False
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 16
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 10
  layers_post_mp: 1
  dim_inner: 35
  act: relu
  residual: True
  dropout: 0.15
  agg: mean
  hybrid:
    num_attn_heads: 8
    num_gnn_heads: 4
    d_h: 256
    attn_mask: full
    gate: headwise
    norm: layernorm
    # Single type → repeated to num_gnn_heads (4× GATEDGCN).
    gnn_types: "GATEDGCN"
    attn_dropout: 0.2
    mp_dropout: 0.1
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.00001
  base_lr: 0.0004664095260901795
  min_lr: 0.0
  max_epoch: 400
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
