# CIFAR10 hybrid anchor — frozen hyperparams from W&B ulij45a2 (best hybrid, seed 0).
#
# Repro commit: ca47851df38e54a3ed052be53f9072bcb159464e
# Paper repro: 5 seeds via submit_cifar10_hybrid_ulij45a2_paper_repro.sh
# W&B group: paper_bestmodel_v1_cifar10_ulij45a2 | tags: paper_repro, bestmodel_v1
#
# Architecture: 8×attention + 4×GATEDGCN MP, d_h=256, layers_mp=10.
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v1_cifar10_ulij45a2
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v1
    - cifar10
    - anchor_ulij45a2
    - hybrid_a8g4
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CIFAR10
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: LinearEdge
  edge_encoder_bn: False
posenc_RWSE:
  enable: False
  kernel:
    times_func: range(1,21)
  model: Linear
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: mean
gnn:
  head: default
  layers_mp: 10
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 35
  act: relu
  dropout: 0.15
  agg: mean
  ffn: False
  residual: True
  hybrid:
    num_attn_heads: 8
    num_gnn_heads: 4
    d_h: 256
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GATEDGCN"
    attn_dropout: 0.2
    mp_dropout: 0.1
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0004664095260901795
  max_epoch: 400
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
