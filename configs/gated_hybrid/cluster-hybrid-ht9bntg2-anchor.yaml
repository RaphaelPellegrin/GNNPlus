# CLUSTER hybrid anchor — frozen hyperparams from run ht9bntg2 / paper repro vkno6rq8.
#
# Source run: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/vkno6rq8
# Lineage: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/ht9bntg2
# Architecture: a1g1 — 1×attn + 1×GATEDGCN MP, d_h=64, dim_inner=56, headwise gate,
#   layernorm, full mask, LinearNode+RWSE, L16, ep=100.
# Source test accuracy-SBM (seed 3): 0.79031
#
# Sweep: bash_interface/sweeps/cluster_hybrid_ht9bntg2_sweep.yaml
out_dir: results
metric_best: accuracy-SBM
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - cluster
    - anchor_ht9bntg2
    - hybrid_a1g1
    - gatedgcn
    - rwse
    - gate_headwise
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CLUSTER
  task: graph
  task_type: classification
  transductive: False
  split_mode: standard
  add_virtual_nodes: False
  num_virtual_nodes: 0
  node_encoder: True
  node_encoder_name: LinearNode+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,21)
  model: Linear
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
  edge_decoding: dot
gnn:
  head: inductive_node
  layers_mp: 16
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 56
  act: relu
  dropout: 0.2
  agg: mean
  ffn: False
  residual: True
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 64
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GATEDGCN"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1.0e-5
  base_lr: 0.001492
  min_lr: 0.0
  max_epoch: 100
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
