# CLUSTER hybrid anchor — frozen hyperparams from W&B ht9bntg2 (seed 1).
#
# Repro commit: 8138ddee6f3fa4d58052ebd86d17939e832eaea3
# Paper repro: 5 seeds via submit_cluster_hybrid_ht9bntg2_paper_repro.sh
# W&B group: paper_bestmodel_v1_cluster_ht9bntg2 | tags: paper_repro, bestmodel_v1
#
# test/accuracy-SBM ≈ 0.793 | a1g1 GATEDGCN, d_h=64, lr=0.001492, full mask, RWSE.
# Refine sweep: bash_interface/cluster/submit_cluster_hybrid_ht9bntg2_refine_sweep.sh
out_dir: results
metric_best: accuracy-SBM
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v1_cluster_ht9bntg2
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v1
    - cluster
    - anchor_ht9bntg2
    - hybrid_a1g1
    - gate_headwise
    - rwse
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CLUSTER
  task: graph
  task_type: classification
  transductive: False
  split_mode: standard
  node_encoder: True
  node_encoder_name: LinearNode+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,21)
  model: Linear
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
  edge_decoding: dot
gnn:
  head: inductive_node
  ffn: False
  layers_mp: 16
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 56
  act: relu
  dropout: 0.2
  agg: mean
  normalize_adj: False
  residual: True
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 64
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GATEDGCN"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.001492
  max_epoch: 100
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
