# COCO-SP baby ≤500k from 5b4z9l3u a1g1 → H=36 d_h=36 L=12.
out_dir: results
metric_best: f1
num_workers: 6
wandb:
  use: false
  project: GNNPlus
  group: paper_budget_coco_b500k
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_budget
  - paper_budget_coco_b500k
  - coco
  - b500k
  - hybrid_a1g1
dataset:
  format: PyG-COCOSuperpixels
  name: edge_wt_region_boundary
  slic_compactness: 30
  task: graph
  task_type: classification
  transductive: false
  node_encoder: true
  node_encoder_name: COCONode
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: COCOEdge
  edge_encoder_bn: false
posenc_RWSE:
  enable: false
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: true
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
gnn:
  head: inductive_node
  ffn: false
  layers_pre_mp: 0
  layers_mp: 12
  layers_post_mp: 1
  dim_inner: 36
  act: gelu
  dropout: 0.05
  agg: mean
  normalize_adj: false
  residual: true
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 36
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: GATEDGCN
    attn_dropout: 0.1
    mp_dropout: 0.05
    block_bn: false
    log_gate_stats: true
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
