# CIFAR10 ≤2M from ulij45a2 a8g4 → a1g2.
# Prior H=56/d_h=96 was 2.24M (over). Recounted fit: H=82, d_h=84, L=10 → ~1.998M.
out_dir: results
metric_best: accuracy
wandb:
  use: false
  project: GNNPlus
  group: paper_budget_cifar10_b2m_fit
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_budget
  - paper_budget_cifar10_b2m_fit
  - cifar10
  - b2m
  - hybrid_a1g2
  - params_fit
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CIFAR10
  task: graph
  task_type: classification
  transductive: false
  node_encoder: true
  node_encoder_name: LinearNode
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: LinearEdge
  edge_encoder_bn: false
posenc_RWSE:
  enable: false
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 16
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: graph
  ffn: false
  layers_pre_mp: 0
  layers_mp: 10
  layers_post_mp: 1
  dim_inner: 82
  act: relu
  residual: true
  dropout: 0.15
  agg: mean
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 2
    d_h: 84
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: GATEDGCN,GATEDGCN
    attn_dropout: 0.2
    mp_dropout: 0.1
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: true
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 1.0e-05
  base_lr: 0.0004664095260901795
  min_lr: 0.0
  max_epoch: 400
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
