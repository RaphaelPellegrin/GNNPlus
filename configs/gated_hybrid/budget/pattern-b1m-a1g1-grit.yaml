# PATTERN b1m from ta9qtxb9 a2g2 → a1g1 GCNE+GRIT, H=64, d_h=64.
out_dir: results
metric_best: accuracy-SBM
wandb:
  use: false
  project: GNNPlus
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_budget
  - paper_budget_pattern_b1m
  - pattern
  - b1m
  - hybrid_a1g1
  group: paper_budget_pattern_b1m
dataset:
  format: PyG-GNNBenchmarkDataset
  name: PATTERN
  task: graph
  task_type: classification
  transductive: false
  split_mode: standard
  add_virtual_nodes: false
  num_virtual_nodes: 0
  node_encoder: true
  node_encoder_name: LinearNode+RWSE
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: DummyEdge
  edge_encoder_bn: false
posenc_RWSE:
  enable: true
  kernel:
    times_func: range(1,33)
  model: Linear
  raw_norm_type: BatchNorm
posenc_RRWP:
  enable: true
  ksteps: 21
  add_identity: true
  add_node_attr: false
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
  edge_decoding: dot
gnn:
  head: inductive_node
  layers_mp: 12
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64
  act: relu
  dropout: 0.05
  agg: mean
  ffn: true
  residual: true
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 64
    attn_mask: graph_restricted
    gate: elementwise
    norm: rmsnorm
    gnn_types: GCNE
    attn_dropout: 0.2
    mp_dropout: 0.15
    block_bn: false
    log_gate_stats: true
    attn_type: grit
    grit:
      clamp: 5.0
      edge_enhance: true
      act: relu
      use_bias: false
      pad_to_full_graph: true
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 1.0e-05
  base_lr: 0.0022173922801332815
  min_lr: 0.0
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
