# ZINC ~100k a1g1 GINE H=38 d_h=12 L=10 (~99.92k).
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: false
  project: GNNPlus
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_budget
  - b100k
  - paper_budget_zinc_b100k
  - zinc
  - hybrid_a1g1
  group: paper_budget_zinc_b100k
dataset:
  format: PyG-ZINC
  name: subset
  task: graph
  task_type: regression
  transductive: false
  node_encoder: true
  node_encoder_name: TypeDictNode+RWSE
  node_encoder_num_types: 21
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: false
posenc_RWSE:
  enable: true
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: add
gnn:
  head: san_graph
  layers_mp: 10
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 38
  act: relu
  dropout: 0.0
  agg: mean
  ffn: true
  residual: true
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 12
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: GINE
    attn_dropout: 0.1
    mp_dropout: 0.0
    block_bn: false
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.001
  max_epoch: 2000
  scheduler: cosine_with_warmup
  num_warmup_epochs: 50
  min_lr: 1e-6
