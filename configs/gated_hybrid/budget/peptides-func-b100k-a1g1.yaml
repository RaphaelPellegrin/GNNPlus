# Peptides-func ~100k a1g1 GINE H=36 d_h=36 L=6 (~100.0k); max_epoch=600.
out_dir: results
metric_best: ap
wandb:
  use: false
  project: GNNPlus
  group: paper_budget_peptides_func_b100k
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_budget
  - b100k
  - paper_budget_peptides_func_b100k
  - peptides_func
  - hybrid_a1g1
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: false
  node_encoder: true
  node_encoder_name: Atom+RWSE
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: Bond
  edge_encoder_bn: false
posenc_RWSE:
  enable: true
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: false
  layers_pre_mp: 0
  layers_mp: 6
  layers_post_mp: 4
  dim_inner: 36
  act: gelu
  residual: false
  dropout: 0.2
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 36
    gate: elementwise
    norm: rmsnorm
    gnn_types: GINE
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: true
    attn_mask: full
    attn_dropout: 0.1
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.0004727701466266201
  max_epoch: 600
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
