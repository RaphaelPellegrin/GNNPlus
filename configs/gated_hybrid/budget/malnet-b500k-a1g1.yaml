# MalNet-Tiny baby ≤500k from vcb1cuql a1g1 → H=96 d_h=56 L=8 GCNE.
out_dir: results
metric_best: accuracy
wandb:
  use: false
  project: GNNPlus
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_budget
  - paper_budget_malnet_b500k
  - malnet
  - b500k
  - hybrid_a1g1
  group: paper_budget_malnet_b500k
dataset:
  format: PyG-MalNetTiny
  name: LocalDegreeProfile
  task: graph
  task_type: classification
  transductive: false
  split_mode: standard
  node_encoder: true
  node_encoder_name: LinearNode
  node_encoder_bn: true
  edge_encoder: true
  edge_encoder_name: DummyEdge
  edge_encoder_bn: false
  add_virtual_nodes: false
  num_virtual_nodes: 0
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max
gnn:
  head: graph
  layers_mp: 8
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 96
  act: relu
  dropout: 0.0
  agg: mean
  ffn: false
  residual: true
  batchnorm: false
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 56
    attn_mask: graph_restricted
    gate: elementwise
    norm: layernorm
    gnn_types: GCNE
    attn_dropout: 0.1
    mp_dropout: 0.05
    block_bn: false
    log_gate_stats: true
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 1.0e-05
  base_lr: 0.000371
  min_lr: 1.0e-06
  max_epoch: 150
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
