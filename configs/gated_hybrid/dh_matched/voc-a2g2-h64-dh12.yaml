# VOC Tab.4 SiGMA a2g2: H 95→64 + d_h=12 (~499k ≤500k). Heads/L/LR frozen; H shrink required (d_h=1 @ H95 still ~623k).
out_dir: results
metric_best: f1
num_workers: 6
wandb:
  use: false
  project: GNNPlus
  group: paper_sigma_dh_matched_voc_h64_dh12
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_dh_matched
  - paper_sigma_dh_matched_voc_h64_dh12
  - voc
  - h64
  - dh12
  - b500k
  - hybrid_a2g2
dataset:
  format: PyG-VOCSuperpixels
  name: edge_wt_region_boundary
  slic_compactness: 30
  task: graph
  task_type: classification
  transductive: false
  node_encoder: true
  node_encoder_name: VOCNode+RWSE
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: VOCEdge
  edge_encoder_bn: false
posenc_RWSE:
  enable: true
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 8
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: true
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
  graph_pooling: add
gnn:
  head: inductive_node
  ffn: true
  layers_pre_mp: 0
  layers_mp: 16
  layers_post_mp: 1
  dim_inner: 64
  act: gelu
  residual: true
  dropout: 0.1
  agg: add
  normalize_adj: false
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 2
    d_h: 12
    attn_mask: full
    gate: headwise
    norm: rmsnorm
    gnn_types: GATEDGCN,GATEDGCN
    attn_dropout: 0.1
    mp_dropout: 0.15
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: true
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.00030671340415785184
  min_lr: 0.0
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
