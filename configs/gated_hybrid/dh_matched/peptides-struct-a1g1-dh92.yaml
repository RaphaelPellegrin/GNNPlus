# Pep-struct Tab.4 SiGMA a1g1 GINE H200: d_h=92 (~998k b1m). Heads/L/H/LR frozen.
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: false
  project: GNNPlus
  group: paper_sigma_dh_matched_pepstruct_dh92
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_dh_matched
  - paper_sigma_dh_matched_pepstruct_dh92
  - peptides_struct
  - dh92
  - b1m
  - hybrid_a1g1
dataset:
  format: OGB
  name: peptides-structural
  task: graph
  task_type: regression
  transductive: false
  add_virtual_nodes: false
  num_virtual_nodes: 0
  node_encoder: true
  node_encoder_name: Atom+RWSE
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: Bond
  edge_encoder_bn: false
posenc_RWSE:
  enable: true
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: false
model:
  type: hybrid_gnn
  loss_fun: l1
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: false
  layers_pre_mp: 0
  layers_mp: 5
  layers_post_mp: 3
  dim_inner: 200
  act: gelu
  residual: false
  dropout: 0.2
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 92
    attn_mask: full
    gate: elementwise
    norm: layernorm
    gnn_types: GINE
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: true
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.0007
  min_lr: 0.0
  max_epoch: 250
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
