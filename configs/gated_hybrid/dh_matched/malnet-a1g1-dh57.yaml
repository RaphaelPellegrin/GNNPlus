# MalNet Tab.4 SiGMA a1g1 GCNE H110: d_h=57 (~498k ≤500k). Heads/L/H/LR frozen.
out_dir: results
metric_best: accuracy
wandb:
  use: false
  project: GNNPlus
  group: paper_sigma_dh_matched_malnet_dh57
  tags:
  - gnnplus
  - hybrid_gnn
  - sigma_dh_matched
  - paper_sigma_dh_matched_malnet_dh57
  - malnet
  - dh57
  - b500k
  - hybrid_a1g1
dataset:
  format: PyG-MalNetTiny
  name: LocalDegreeProfile
  task: graph
  task_type: classification
  transductive: false
  node_encoder: false
  edge_encoder: true
  edge_encoder_name: DummyEdge
  edge_encoder_bn: false
  add_virtual_nodes: false
  num_virtual_nodes: 0
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max
gnn:
  head: default
  ffn: false
  layers_mp: 8
  layers_pre_mp: 1
  layers_post_mp: 1
  dim_inner: 110
  batchnorm: true
  act: relu
  dropout: 0.0
  agg: mean
  residual: true
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 57
    attn_mask: graph_restricted
    gate: elementwise
    norm: layernorm
    gnn_types: GCNE
    attn_dropout: 0.0
    mp_dropout: 0.0
    block_bn: false
    log_gate_stats: true
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0003711197217247589
  max_epoch: 150
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
