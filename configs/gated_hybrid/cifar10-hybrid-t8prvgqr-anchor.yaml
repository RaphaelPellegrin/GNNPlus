# CIFAR10 hybrid anchor — frozen hyperparams from W&B t8prvgqr (sweep f2pecp63).
# best/test_accuracy ≈ 0.7998 | a4g4, d_h=128, layers_mp=10, GATEDGCN MP, seed 0.
# Virtual-node ablation: bash_interface/cluster/submit_cifar10_hybrid_vn_ablation.sh
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - cifar10_anchor_t8prvgqr
    - cifar10_vn_ablation
dataset:
  format: PyG-GNNBenchmarkDataset
  name: CIFAR10
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: LinearEdge
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
posenc_RWSE:
  enable: False
  kernel:
    times_func: range(1,21)
  model: Linear
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: mean
gnn:
  head: graph
  layers_mp: 10
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 35
  act: relu
  dropout: 0.15
  agg: mean
  ffn: False
  residual: True
  hybrid:
    num_attn_heads: 4
    num_gnn_heads: 4
    d_h: 128
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GATEDGCN"
    attn_dropout: 0.2
    mp_dropout: 0.1
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0004499432330095277
  max_epoch: 400
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
