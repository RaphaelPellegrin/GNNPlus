# Peptides-func UniGCN hybrid anchor — frozen hyperparams from sweep run 124caj93.
#
# Source run: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/124caj93
# Sweep: bq62chmz (peptides_func_hybrid_unigcn_sweep)
# Commit: 8dc3a399366d90483979d8c1488398a11c163df7
# Branch name hint: peptides-functional.hybrid_gnn.hybrid_a2g3+RWSE.r0
#
# Architecture: a2g3 — 2×attn + GINE,GCNE,UNIGCN @ d_h=128, headwise gate,
#   layernorm, full attn mask, Atom+RWSE, L3/H275, T=16, max_epoch=300.
#
# 10-seed repro: submit_peptides_func_hybrid_124caj93_a2g3_seeds.sh
out_dir: results
metric_best: ap
wandb:
  use: False
  project: GNNPlus
  group: peptides_func_124caj93_a2g3_seeds
  tags:
    - gnnplus
    - hybrid_gnn
    - unigcn
    - peptides_func
    - anchor_124caj93
    - hybrid_a2g3
    - gine
    - gcne
    - rwse
    - sweep_bq62chmz
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 3
  layers_post_mp: 4
  dim_inner: 275
  act: gelu
  residual: False
  dropout: 0.2
  use_hermitian: False
  unitary_taylor_order: 16
  unitary_return_real: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 3
    d_h: 128
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GINE,GCNE,UNIGCN"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.0005650212198206989
  max_epoch: 300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
