# Hybrid GNN on MalNet-Tiny — outer hyperparams from configs/gcn/mal.yaml.
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: MOE_6
  tags:
    - gnnplus
    - hybrid_gnn
    - cluster
dataset:
  format: PyG-MalNetTiny
  name: LocalDegreeProfile
  task: graph
  task_type: classification
  transductive: False
  node_encoder: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max
gnn:
  head: default
  layers_mp: 8
  layers_pre_mp: 1
  layers_post_mp: 1
  dim_inner: 110
  act: relu
  dropout: 0.0
  agg: mean
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 2
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCN,GIN"
    attn_dropout: 0.1
    mp_dropout: 0.0
    block_bn: false
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0005
  max_epoch: 150
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
