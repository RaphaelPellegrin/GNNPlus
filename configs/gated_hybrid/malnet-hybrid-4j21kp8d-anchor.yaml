# MalNet-Tiny (LDP) hybrid anchor — frozen hyperparams from W&B 4j21kp8d (seed 0).
#
# Repro commit: 5f30e22107510047fdad90910bf343fdf7b44c96
# Paper repro: 5 seeds via submit_malnet_hybrid_4j21kp8d_paper_repro.sh
# W&B group: paper_bestmodel_v2_malnet_4j21kp8d | tags: paper_repro, bestmodel_v2
#
# MalNet bestmodel_v2 (compare variance vs v1 / 9h3jqzkm a0g2).
# Architecture: 1×attention + 2×GCNE/GINE MP (a1g2), d_h=110, elementwise gate.
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v2_malnet_4j21kp8d
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v2
    - malnet
    - anchor_4j21kp8d
    - hybrid_a1g2
    - gate_elementwise
dataset:
  format: PyG-MalNetTiny
  name: LocalDegreeProfile
  task: graph
  task_type: classification
  transductive: False
  node_encoder: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max
gnn:
  head: default
  ffn: False
  layers_mp: 8
  layers_pre_mp: 1
  layers_post_mp: 1
  dim_inner: 110
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  residual: True
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 2
    d_h: 110
    attn_mask: graph_restricted
    gate: elementwise
    norm: rmsnorm
    gnn_types: "GCNE,GINE"
    attn_dropout: 0.0
    mp_dropout: 0.0
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0009585746969426988
  max_epoch: 150
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
