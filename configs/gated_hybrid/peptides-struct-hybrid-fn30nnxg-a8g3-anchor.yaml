# Peptides-struct hybrid anchor — frozen hyperparams from sweep run fn30nnxg.
#
# Source run: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/fn30nnxg
# Base config: peptides-struct-hybrid-rholn782-anchor.yaml (rholn782 / VN / pyramid / RWSE k=20)
#
# Paper repro: 5 seeds via submit_peptides_struct_hybrid_fn30nnxg_a8g3_paper_repro.sh
# W&B group: paper_bestmodel_v2_peptides_struct_fn30nnxg_a8g3_ep250
#
# Architecture: a8g3 — 8×attn + 3× MP (GINE,GINE,GGNN), d_h=16, VN=4, L12/H96, ep=250.
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v2_peptides_struct_fn30nnxg_a8g3_ep250
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v2
    - peptides_struct
    - max_epoch_250
    - anchor_fn30nnxg
    - hybrid_a8g3
    - gate_headwise
    - gine_ggnn
    - virtual_nodes
    - vn4
    - pyramid_readout
    - rwse
    - sweep_o8wijtq7
dataset:
  format: OGB
  name: peptides-structural
  task: graph
  task_type: regression
  transductive: False
  add_virtual_nodes: True
  num_virtual_nodes: 4
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: l1
  graph_pooling: mean
gnn:
  head: mlp_graph
  readout_mlp: pyramid
  ffn: True
  layers_pre_mp: 0
  layers_mp: 12
  layers_post_mp: 3
  dim_inner: 96
  act: gelu
  residual: True
  dropout: 0.0
  hybrid:
    num_attn_heads: 8
    num_gnn_heads: 3
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GINE,GINE,GGNN"
    attn_dropout: 0.0
    mp_dropout: 0.0
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.00020166783414059432
  max_epoch: 250
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
  min_lr: 0.0
