# MalNet-Tiny hybrid anchor — apiw6l3u lineage, a0g3 (0 attn + 3×GCNE MP).
#
# Parent run: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/apiw6l3u
# (v1 paper repro seed 2, a0g2, best_test_perf ≈ 0.944)
# Change vs apiw6l3u / 9h3jqzkm v1: num_gnn_heads 2 → 3 (hybrid_a0g3).
#
# Paper repro: 5 seeds via submit_malnet_hybrid_apiw6l3u_paper_repro.sh
# W&B group: paper_bestmodel_v4_malnet_apiw6l3u | tags: paper_repro, bestmodel_v4
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v4_malnet_apiw6l3u
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v4
    - malnet
    - anchor_apiw6l3u
    - hybrid_a0g3
    - gate_elementwise
    - graph_restricted
dataset:
  format: PyG-MalNetTiny
  name: LocalDegreeProfile
  task: graph
  task_type: classification
  transductive: False
  node_encoder: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max
gnn:
  head: default
  ffn: False
  layers_mp: 8
  layers_pre_mp: 1
  layers_post_mp: 1
  dim_inner: 110
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  residual: True
  hybrid:
    num_attn_heads: 0
    num_gnn_heads: 3
    d_h: 110
    attn_mask: graph_restricted
    gate: elementwise
    norm: rmsnorm
    gnn_types: "GCNE"
    attn_dropout: 0.1
    mp_dropout: 0.05
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0019142361730964056
  max_epoch: 150
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
