# Peptides-func Level 2ter (= "2bis_bis 2"): SiGMA hybrid collapsed toward Level 1.
#
# Still model.type: hybrid_gnn (gated hybrid block API), but:
#   - a0g1, d_h = dim_inner = 275
#   - norm: none, residual: false
#   - identity_proj: true  → NO Linear(d→d_h), NO out_proj Linear; GCNE on full x
#   - gate: separate Linear(d→1) like Level 1 (not split(W_hg · x))
#
# Intended check: if this matches Level 1, the hybrid *projection* (not "being hybrid")
# was the performance gap.
out_dir: results
metric_best: ap
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - fairness_ladder
    - level_2ter
    - hybrid_a0g1
    - no_ln
    - no_residual
    - identity_proj
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 3
  layers_post_mp: 4
  dim_inner: 275
  act: gelu
  residual: False
  dropout: 0.2
  hybrid:
    num_attn_heads: 0
    num_gnn_heads: 1
    d_h: 275
    attn_mask: full
    gate: headwise
    norm: none
    residual: false
    identity_proj: true
    gnn_types: "GCNE"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
