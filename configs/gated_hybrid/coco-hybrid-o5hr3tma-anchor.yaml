# COCO-SP hybrid anchor — frozen hyperparams from W&B o5hr3tma (seed 0).
#
# Repro commit: ca47851df38e54a3ed052be53f9072bcb159464e
# Paper repro: 5 seeds via submit_coco_hybrid_o5hr3tma_paper_repro.sh
# W&B group: paper_bestmodel_v1_coco_o5hr3tma | tags: paper_repro, bestmodel_v1
#
# Architecture: 2×attention + 8×GATEDGRAPH MP (a2g8), d_h=32, elementwise gate.
out_dir: results
metric_best: f1
num_workers: 6
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v1_coco_o5hr3tma
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v1
    - coco
    - anchor_o5hr3tma
    - hybrid_a2g8
    - gate_elementwise
dataset:
  format: PyG-COCOSuperpixels
  name: edge_wt_region_boundary
  slic_compactness: 30
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: COCONode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: COCOEdge
  edge_encoder_bn: False
posenc_RWSE:
  enable: False
train:
  mode: custom
  batch_size: 8
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: True
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
gnn:
  head: inductive_node
  layers_pre_mp: 0
  layers_mp: 18
  layers_post_mp: 1
  dim_inner: 70
  act: gelu
  dropout: 0.05
  agg: mean
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 8
    d_h: 32
    attn_mask: full
    gate: elementwise
    norm: rmsnorm
    gnn_types: "GATEDGRAPH,GATEDGRAPH"
    attn_dropout: 0.1
    mp_dropout: 0.05
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
