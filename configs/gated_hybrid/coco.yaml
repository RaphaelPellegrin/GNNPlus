# Hybrid GNN on COCO-SP — outer hyperparams from configs/gcn/coco.yaml (paper gcne).
# Submit with --mem=128GB on cluster.
out_dir: results
metric_best: f1
num_workers: 6
wandb:
  use: False
  project: MOE_6
  tags:
    - gnnplus
    - hybrid_gnn
    - cluster
dataset:
  format: PyG-COCOSuperpixels
  name: edge_wt_region_boundary
  slic_compactness: 30
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: COCONode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: COCOEdge
  edge_encoder_bn: False
posenc_RWSE:
  enable: False
train:
  mode: custom
  batch_size: 8
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: True
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
gnn:
  head: inductive_node
  layers_pre_mp: 0
  layers_mp: 18
  layers_post_mp: 1
  dim_inner: 70
  act: gelu
  dropout: 0.05
  agg: mean
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 2
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCN,GIN"
    attn_dropout: 0.1
    mp_dropout: 0.05
    block_bn: false
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
