# ENZYMES SiGMA / HybridGated anchor — frozen from Heterogeneity_Profile W&B run
# https://wandb.ai/weber-geoml-harvard-university/MOE_6/runs/ogpkubk9
#   best/test_acc ≈ 0.607 (trial_02); a4g4 GCN,GIN,SAGE,GAT; plateau; L12/H64/dh16
#
# Source CLI used plateau + patience=200 early-stop (stopped ~epoch 381).
# Here: reduce_on_plateau LR schedule, max_epoch=1000 (covers original stop).
out_dir: results
metric_best: accuracy
metric_agg: argmax
wandb:
  use: False
  project: GNNPlus
  entity: weber-geoml-harvard-university
  group: enzymes_ogpkubk9_a4g4_plateau_seeds
  tags:
    - gnnplus
    - hybrid_gnn
    - enzymes
    - ogpkubk9
    - a4g4
    - plateau
    - paper_repro
dataset:
  format: PyG-TUDataset
  name: ENZYMES
  task: graph
  task_type: classification
  transductive: False
  # Match Heterogeneity_Profile Experiment defaults (not 10-fold CV).
  split_mode: random
  split: [0.5, 0.25, 0.25]
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  # ENZYMES has 0 edge features; LinearEdge needs RWSE times_func otherwise.
  edge_encoder: False
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  ckpt_period: 100
  enable_ckpt: False
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: mean
gnn:
  head: default
  layers_mp: 12
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 64
  act: relu
  dropout: 0.1
  agg: mean
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 4
    num_gnn_heads: 4
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCN,GIN,SAGE,GAT"
    attn_dropout: 0.1
    mp_dropout: 0.1
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  min_lr: 0.0
  max_epoch: 1000
  scheduler: reduce_on_plateau
  reduce_factor: 0.5
  schedule_patience: 50
  num_warmup_epochs: 0
