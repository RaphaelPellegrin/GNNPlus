# Hybrid GNN on peptides-func — 1×GCN MP + 1×attention (a1g1).
# Outer hyperparams from configs/gcn/peptides-func.yaml (best single-head baseline).
# max_epoch doubled (300→600) for fuller training.
out_dir: results
metric_best: ap
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - cluster
    - peptides_func_gcn_a1g1
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 3
  layers_post_mp: 4
  dim_inner: 275
  act: gelu
  residual: False
  dropout: 0.2
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 64
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCNE"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 600
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
