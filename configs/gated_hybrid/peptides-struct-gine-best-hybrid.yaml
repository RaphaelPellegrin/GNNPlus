# Peptides-struct best-hybrid — replicate MOE_6 HybridGated anchor (run rholn782).
# Heterogeneity_Profile: L12, H96, GINE+GGNN a2g2, d_h=16, ffn+skip, lr=4e-4, bs=64.
#
# GNNPlus gap vs MOE: g_rwpe_k21 → posenc_RWSE range(1,21) (approximate).
#
# Sweep: bash_interface/sweeps/peptides_struct_best_hybrid_sweep.yaml
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - cluster
    - peptides_struct_gine_best_hybrid
    - moe6_rholn782_anchor
    - virtual_nodes
    - pyramid_readout
dataset:
  format: OGB
  name: peptides-structural
  task: graph
  task_type: regression
  transductive: False
  add_virtual_nodes: True
  num_virtual_nodes: 4
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: l1
  graph_pooling: mean
gnn:
  head: mlp_graph
  readout_mlp: pyramid
  ffn: True
  layers_pre_mp: 0
  layers_mp: 12
  layers_post_mp: 3
  dim_inner: 96
  act: gelu
  residual: True
  dropout: 0.0
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 2
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GINE,GGNN"
    attn_dropout: 0.0
    mp_dropout: 0.0
    block_bn: false
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.0004
  max_epoch: 250
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
  min_lr: 0.0
