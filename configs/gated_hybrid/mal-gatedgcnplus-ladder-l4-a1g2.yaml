# MalNet-Tiny GatedGCN+ ladder Level 4: 1×attn + 2×MP heads (GatedGCN, GINE) with headwise gating.
# Outer hyperparams match configs/gatedgcn/mal.yaml (ICML 2025 paper baseline).
# attn_mask: graph_restricted is critical on MalNet to avoid OOM on large graphs (~1410 nodes).
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - gatedgcnplus_ladder
    - level_4
    - mal_a1g2_gated
dataset:
  format: PyG-MalNetTiny
  name: LocalDegreeProfile
  task: graph
  task_type: classification
  transductive: False
  node_encoder: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: max
gnn:
  head: default
  layers_mp: 6
  layers_pre_mp: 1
  layers_post_mp: 1
  dim_inner: 100
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 2
    d_h: 100
    attn_mask: graph_restricted
    gate: headwise
    norm: rmsnorm
    gnn_types: "GATEDGCN,GINE"
    attn_dropout: 0.1
    mp_dropout: 0.0
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0005
  max_epoch: 150
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
