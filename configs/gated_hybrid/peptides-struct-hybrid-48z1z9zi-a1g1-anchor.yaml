# Peptides-struct hybrid anchor — frozen hyperparams from sweep run 48z1z9zi.
#
# Source run: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/48z1z9zi
# Base config: peptides-struct-hybrid-xfb9wdir-a0g1-anchor.yaml (xfb9wdir / RWSE lineage)
#
# Paper repro: 5 seeds via submit_peptides_struct_hybrid_48z1z9zi_a1g1_paper_repro.sh
# W&B group: paper_bestmodel_v2_peptides_struct_48z1z9zi_a1g1_ep400
#
# Architecture: a1g1 — 1×attn + 1×GINE MP, d_h=64, headwise gate, layernorm, full mask,
#   Atom+RWSE, L5/H200, max_epoch=400.
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v2_peptides_struct_48z1z9zi_a1g1_ep400
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v2
    - peptides_struct
    - max_epoch_400
    - anchor_48z1z9zi
    - hybrid_a1g1
    - gate_headwise
    - gine
    - rwse
    - sweep_dz1j1uu7
dataset:
  format: OGB
  name: peptides-structural
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: l1
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 5
  layers_post_mp: 3
  dim_inner: 200
  act: gelu
  residual: False
  dropout: 0.2
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 64
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GINE"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.0005885707666416795
  max_epoch: 400
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
