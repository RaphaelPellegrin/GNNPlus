# Peptides-struct hybrid anchor — frozen from LR sweep run g3bsaq32 (b7_m0).
#
# Source run: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/g3bsaq32
# Parent: 63avcc5m a1g1 anchor with base_lr=7e-4, min_lr=0
#
# Paper repro (10 seeds):
#   ep250: submit_peptides_struct_hybrid_g3bsaq32_b7m0_ep250_paper_repro.sh
#   ep350: submit_peptides_struct_hybrid_g3bsaq32_b7m0_ep350_paper_repro.sh
#
# Architecture: a1g1 — 1×attn + 1×GINE, d_h=200, elementwise gate, layernorm, RWSE.
# Source val/test MAE (seed 6, ep250): 0.23937 / 0.24126
out_dir: results
metric_best: mae
metric_agg: argmin
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v2_peptides_struct_g3bsaq32_b7m0_ep250
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v2
    - peptides_struct
    - anchor_g3bsaq32
    - lr_b7_m0
    - hybrid_a1g1
    - gate_elementwise
    - gine
    - rwse
    - no_virtual_nodes
dataset:
  format: OGB
  name: peptides-structural
  task: graph
  task_type: regression
  transductive: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: l1
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 5
  layers_post_mp: 3
  dim_inner: 200
  act: gelu
  residual: False
  dropout: 0.2
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 200
    attn_mask: full
    gate: elementwise
    norm: layernorm
    gnn_types: "GINE"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.0007
  min_lr: 0.0
  max_epoch: 250
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
