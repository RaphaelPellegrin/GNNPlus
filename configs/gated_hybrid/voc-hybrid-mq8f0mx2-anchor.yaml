# VOC-SP hybrid anchor — frozen hyperparams from W&B mq8f0mx2 (sweep hch2kkia).
# best/test_f1 ≈ 0.4511 | a2g4, d_h=48, GATEDGCN,GIN MP, seed 0.
# Virtual-node ablation: bash_interface/cluster/submit_voc_hybrid_vn_ablation.sh
out_dir: results
metric_best: f1
num_workers: 6
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - voc_anchor_mq8f0mx2
    - voc_vn_ablation
dataset:
  format: PyG-VOCSuperpixels
  name: edge_wt_region_boundary
  slic_compactness: 30
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: VOCNode+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: VOCEdge
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 8
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: True
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
gnn:
  head: inductive_node
  ffn: False
  layers_pre_mp: 0
  layers_mp: 14
  layers_post_mp: 1
  dim_inner: 85
  act: gelu
  dropout: 0.1
  agg: add
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 4
    d_h: 48
    attn_mask: full
    gate: elementwise
    norm: layernorm
    gnn_types: "GATEDGCN,GIN"
    attn_dropout: 0.2
    mp_dropout: 0.15
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.0006311178521351621
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
