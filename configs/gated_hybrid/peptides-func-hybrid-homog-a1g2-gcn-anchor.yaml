# Peptides-func NEW best hybrid — Table 6 Homog_MP (a1g2 GCN×2, gated).
#
# Source campaign: paper_T6_peptides_func_Homog_MP
#   AP 0.7080 ± 0.0063 (n=5) — beats paper a1g1 SiGMA 0.7052 ± 0.0056 (n=10)
# Hyperparams frozen from o5cdk766 a1g1 anchor; only head counts / types change:
#   num_attn_heads=1, num_gnn_heads=2, gnn_types=GCN,GCN, gate=elementwise.
#
# MP-only follow-up (attn → GCN): a0g3 GCN,GCN,GCN — see
#   submit_peptides_func_homog_a1g2_mp_only.sh
out_dir: results
metric_best: ap
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v3_peptides_func_homog_a1g2
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v3
    - peptides_func
    - max_epoch_900
    - anchor_o5cdk766
    - hybrid_a1g2
    - homog_mp
    - gate_elementwise
    - gcn
    - rwse
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 3
  layers_post_mp: 4
  dim_inner: 275
  act: gelu
  residual: False
  dropout: 0.2
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 2
    d_h: 128
    attn_mask: graph_restricted
    gate: elementwise
    norm: rmsnorm
    gnn_types: "GCN,GCN"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.00020830328241707908
  min_lr: 0.0
  max_epoch: 900
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
