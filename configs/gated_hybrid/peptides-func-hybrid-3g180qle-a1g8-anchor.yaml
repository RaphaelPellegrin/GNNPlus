# Peptides-func hybrid anchor — 3g180qle GCN lineage, a1g8 (1 attn + 8× GCN MP).
#
# MP baseline: https://wandb.ai/weber-geoml-harvard-university/GNNPlus/runs/3g180qle
#   (configs/gcn/peptides-func.yaml, gcne, seed 2, test AP ≈ 0.7268)
#
# Paper repro: 5 seeds via submit_peptides_func_hybrid_3g180qle_a1g8_paper_repro.sh
# W&B group: paper_bestmodel_v2_peptides_func_3g180qle_a1g8_ep300
#
# Outer hyperparams match configs/gcn/peptides-func.yaml; hybrid adds 1 attn + 8 GCN heads.
out_dir: results
metric_best: ap
wandb:
  use: False
  project: GNNPlus
  group: paper_bestmodel_v2_peptides_func_3g180qle_a1g8_ep300
  tags:
    - gnnplus
    - hybrid_gnn
    - paper_repro
    - bestmodel_v2
    - peptides_func
    - max_epoch_300
    - anchor_3g180qle
    - hybrid_a1g8
    - gate_elementwise
    - gcn
    - rwse
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: mlp_graph
  ffn: False
  layers_pre_mp: 0
  layers_mp: 3
  layers_post_mp: 4
  dim_inner: 275
  act: gelu
  residual: False
  dropout: 0.2
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 8
    d_h: 64
    attn_mask: graph_restricted
    gate: elementwise
    norm: rmsnorm
    gnn_types: "GCN,GCN,GCN,GCN,GCN,GCN,GCN,GCN"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
