# Hybrid GNN on ogbg-molpcba — outer hyperparams from configs/gcn/pcba.yaml.
out_dir: results
metric_best: ap
wandb:
  use: False
  project: MOE_6
  tags:
    - gnnplus
    - hybrid_gnn
    - cluster
dataset:
  format: OGB
  name: ogbg-molpcba
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,17)
  model: Linear
  dim_pe: 20
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 512
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: mean
gnn:
  head: default
  layers_mp: 10
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 512
  act: relu
  dropout: 0.2
  agg: mean
  ffn: True
  residual: False
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 2
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCN,GINE"
    attn_dropout: 0.1
    mp_dropout: 0.2
    block_bn: false
optim:
  batch_accumulation: 1
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0005
  max_epoch: 100
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
