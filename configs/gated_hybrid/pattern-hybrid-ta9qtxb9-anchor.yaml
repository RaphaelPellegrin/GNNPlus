# PATTERN hybrid anchor — frozen hyperparams from W&B ta9qtxb9 (sweep ve1sldtl).
# best/test_accuracy-SBM ≈ 0.8713 | a2g2, d_h=90, GCNE,GCNE MP, seed 0.
# Virtual-node ablation: bash_interface/cluster/submit_pattern_hybrid_vn_ablation.sh
out_dir: results
metric_best: accuracy-SBM
wandb:
  use: False
  project: GNNPlus
  tags:
    - gnnplus
    - hybrid_gnn
    - pattern_anchor_ta9qtxb9
    - pattern_vn_ablation
dataset:
  format: PyG-GNNBenchmarkDataset
  name: PATTERN
  task: graph
  task_type: classification
  transductive: False
  split_mode: standard
  node_encoder: True
  node_encoder_name: LinearNode+RWSE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
  add_virtual_nodes: False
  num_virtual_nodes: 0
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,33)
  model: Linear
  raw_norm_type: BatchNorm
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
model:
  type: hybrid_gnn
  loss_fun: weighted_cross_entropy
  edge_decoding: dot
gnn:
  head: inductive_node
  ffn: False
  layers_mp: 12
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 90
  act: relu
  dropout: 0.05
  agg: mean
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 2
    d_h: 90
    attn_mask: graph_restricted
    gate: elementwise
    norm: rmsnorm
    gnn_types: "GCNE,GCNE"
    attn_dropout: 0.2
    mp_dropout: 0.15
    block_bn: false
    log_gate_stats: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.0022173922801332815
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
