out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: MUTAG
dataset:
  format: PyG-TUDataset
  name: MUTAG
  task: graph
  task_type: classification
  transductive: False
  split_mode: cv-stratifiedkfold-10
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: LinearEdge
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: False
model:
  type: custom_gnn
  loss_fun: cross_entropy
  edge_decoding: dot
  graph_pooling: mean
gnn:
  head: default
  layer_type: gatedgcn
  layers_mp: 6
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 32
  act: relu
  dropout: 0.05
  agg: mean
  normalize_adj: False
  ffn: True
  residual: True
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.001
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
