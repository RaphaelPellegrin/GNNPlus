# MUTAG heterogeneity profile — hybrid_gnn (fair GCNE MP example).
out_dir: results
metric_best: accuracy
wandb:
  use: False
  project: GNNPlus
dataset:
  format: PyG-TUDataset
  name: MUTAG
  task: graph
  task_type: classification
  transductive: False
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: LinearEdge
  edge_encoder_bn: False
train:
  mode: heterogeneity
  batch_size: 32
  eval_period: 1
  ckpt_period: 100
heterogeneity:
  required_test_appearances: 10
  max_trials: 200
  base_seed: 0
  use_random_split: true
  split: [0.5, 0.25, 0.25]
  save_pickle: true
  plot: true
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: default
  ffn: False
  layers_mp: 4
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 64
  act: relu
  dropout: 0.0
  agg: mean
  residual: True
  hybrid:
    num_attn_heads: 1
    num_gnn_heads: 1
    d_h: 64
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCNE"
    attn_dropout: 0.1
    mp_dropout: 0.0
    block_bn: false
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
