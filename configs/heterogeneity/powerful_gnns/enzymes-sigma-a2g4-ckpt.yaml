# Xu et al. ICLR 2019 HPs + SiGMA hetero a2g4 (GCN,GIN,SAGE,GAT) with checkpoints.
# Same as mutag-sigma-a2g4-ckpt.yaml; dataset.name is ENZYMES.
out_dir: results/heterogeneity/powerful_gnns/tu_xu_sigma_a2g4
metric_best: accuracy
metric_agg: argmax
wandb:
  use: True
  project: GNNPlus
  entity: weber-geoml-harvard-university
  group: ''
  name: ''
dataset:
  format: PyG-TUDataset
  name: ENZYMES
  task: graph
  task_type: classification
  transductive: False
  split_mode: random
  split: [0.5, 0.25, 0.25]
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: False
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 128
  eval_period: 1
  ckpt_period: 100
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: add
gnn:
  head: default
  layers_mp: 4
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 64
  act: relu
  dropout: 0.5
  agg: mean
  ffn: False
  residual: True
  hybrid:
    num_attn_heads: 2
    num_gnn_heads: 4
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    gnn_types: "GCN,GIN,SAGE,GAT"
    attn_dropout: 0.0
    mp_dropout: 0.0
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: True
optim:
  clip_grad_norm: False
  optimizer: adam
  weight_decay: 0.0
  base_lr: 0.01
  max_epoch: 350
  scheduler: step
  steps: [50, 100, 150, 200, 250, 300]
  lr_decay: 0.5
