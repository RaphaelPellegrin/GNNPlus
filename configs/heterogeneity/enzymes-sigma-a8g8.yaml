# ENZYMES SiGMA / HybridGated — large model matching Heterogeneity_Profile
# https://wandb.ai/weber-geoml-harvard-university/MOE_6/runs/7dsqq7z2
#   best/test_acc = 0.58 (trial_08); a8g8 GCN,GIN,SAGE,GAT×2; plateau; L12/H64/dh16
#
# Use for heterogeneity profiles (not the small a2g2 L4 enzymes-sigma.yaml).
out_dir: results/heterogeneity
metric_best: accuracy
metric_agg: argmax
wandb:
  use: True
  project: GNNPlus
  entity: weber-geoml-harvard-university
  group: ''
  name: ''
dataset:
  format: PyG-TUDataset
  name: ENZYMES
  task: graph
  task_type: classification
  transductive: False
  split_mode: random
  split: [0.5, 0.25, 0.25]
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: False
  edge_encoder_bn: False
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  ckpt_period: 100
  enable_ckpt: False
  eval_smoothing_metrics: False
model:
  type: hybrid_gnn
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  head: default
  layers_mp: 12
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 64
  act: relu
  dropout: 0.1
  agg: mean
  ffn: True
  residual: True
  hybrid:
    num_attn_heads: 8
    num_gnn_heads: 8
    d_h: 16
    attn_mask: full
    gate: headwise
    norm: layernorm
    # Match 7dsqq7z2 octet: GCN,GIN,SAGE,GAT repeated twice.
    gnn_types: "GCN,GIN,SAGE,GAT,GCN,GIN,SAGE,GAT"
    attn_dropout: 0.1
    mp_dropout: 0.1
    block_bn: false
    residual: true
    identity_proj: false
    log_gate_stats: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  min_lr: 0.0
  # Source used patience=200 early-stop within max_epochs=3000; cap for cluster.
  max_epoch: 1000
  scheduler: reduce_on_plateau
  reduce_factor: 0.5
  schedule_patience: 50
  num_warmup_epochs: 0
