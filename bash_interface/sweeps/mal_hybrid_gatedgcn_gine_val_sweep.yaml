# MalNet-Tiny: GATEDGCN + GINE hybrid sweep (Lukas plan).
#
# Goal: maximize best/val_accuracy (selection metric).
# Ablate: (a) attention on/off  (b) gating on/off
# MP pool: GATEDGCN / GINE only — no UniGCN, no GCNE.
#
# Do NOT resume paused sweep 84rlksar (GCNE family, test/accuracy, many fails).
# Create new + optional warmstart:
#   PRIOR_RUNS="v4cytwe0 zk6ihqi8 dy4ce9nr" \
#     bash bash_interface/sweeps/create_sweep.sh \
#       bash_interface/sweeps/mal_hybrid_gatedgcn_gine_val_sweep.yaml
#   SWEEP_SLURM_TIME=72:00:00 SWEEP_ARRAY_TASKS=16 SWEEP_ARRAY_PARALLEL=6 \
#   SWEEP_PARTITION=gpu_h200 RUNS_PER_AGENT=3 \
#     bash bash_interface/sweeps/relaunch_sweep_agents.sh \
#       mal weber-geoml-harvard-university/GNNPlus/<SWEEP_ID>
# Partition: gpu_h200, max 6 concurrent GPUs (%6). MaxTime 72h.

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: best/val_accuracy

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_hybrid_gatedgcn_gine-mal-val_acc

early_terminate:
  type: hyperband
  min_iter: 40
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/mal-gatedgcn-gine-sweep-anchor.yaml
  - --molecular=false
  - --seed=0
  - ${args}

parameters:
  # (a) attention on/off
  hybrid_num_attn_heads:
    values: [0, 1, 2, 4]
  hybrid_attn_mask:
    values: [full, graph_restricted]
  hybrid_attn_dropout:
    values: [0.0, 0.1, 0.2]

  # (b) gating on/off
  hybrid_gate:
    values: [none, headwise, elementwise]

  # MP: GATEDGCN + GINE only
  hybrid_num_gnn_heads:
    values: [1, 2, 4]
  hybrid_gnn_types:
    values:
      - "GINE"
      - "GATEDGCN"
      - "GINE,GINE"
      - "GATEDGCN,GATEDGCN"
      - "GATEDGCN,GINE"
      - "GINE,GATEDGCN"
      - "GATEDGCN,GINE,GATEDGCN,GINE"
      - "GINE,GINE,GATEDGCN,GATEDGCN"

  hybrid_d_h:
    values: [64, 90, 110]
  hybrid_mp_dropout:
    values: [0.0, 0.05, 0.1]
  hybrid_norm:
    values: [layernorm, rmsnorm]
  hybrid_max_epoch:
    values: [150, 250]
  optim.base_lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.002
