# Peptides-func best-hybrid LR follow-up (extends peptides_func_best_hybrid_sweep.yaml).
# Same fair GCNE MP search; wider learning rate (baseline lr=0.001, prior sweep max 0.003).
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/peptides_func_best_hybrid_lr_sweep.yaml
# Launch:
#   SWEEP_ARRAY_TASKS=16 SWEEP_ARRAY_PARALLEL=8 RUNS_PER_AGENT=4 \
#     SWEEP_SLURM_TIME=120:00:00 \
#     bash bash_interface/sweeps/relaunch_sweep_agents.sh \
#       peptides_func weber-geoml-harvard-university/GNNPlus/<SWEEP_ID>

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: test/ap

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_best_hybrid-peptides_func-lr

early_terminate:
  type: hyperband
  min_iter: 50
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/peptides-func-gcn-best-hybrid.yaml
  - --molecular=true
  - --seed=2
  - ${args}

parameters:
  hybrid_num_attn_heads:
    values: [0, 1, 2]
  hybrid_num_gnn_heads:
    values: [1, 2]
  hybrid_gnn_types:
    values:
      - GCNE
      - "GCNE,GCNE"
      - "GCNE,GINE"
      - "GCNE,GCN"
  hybrid_d_h:
    values: [64, 128, 192, 275]
  hybrid_attn_dropout:
    values: [0.0, 0.1, 0.2]
  hybrid_mp_dropout:
    values: [0.1, 0.15, 0.2]
  hybrid_attn_mask:
    values: [full, graph_restricted]
  hybrid_gate:
    values: [headwise, elementwise]
  hybrid_norm:
    values: [layernorm, rmsnorm]
  optim.base_lr:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.01
