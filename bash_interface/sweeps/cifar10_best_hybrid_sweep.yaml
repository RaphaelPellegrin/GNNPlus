# CIFAR10 best-hybrid sweep: scale fair GatedGCN+ hybrid past ~0.76 test/accuracy.
# Base: configs/gated_hybrid/cifar10-gatedgcn-best-hybrid.yaml (GATEDGCN MP, ffn false, 400 ep).
# Swept: attn/gnn head counts (1/2/4), d_h, depth, MP presets, mask/gate/norm, dropout, LR.
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/cifar10_best_hybrid_sweep.yaml
# Launch:
#   SWEEP_ARRAY_TASKS=16 SWEEP_ARRAY_PARALLEL=8 RUNS_PER_AGENT=4 \
#     bash bash_interface/sweeps/relaunch_sweep_agents.sh \
#       cifar10 weber-geoml-harvard-university/GNNPlus/<SWEEP_ID>

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: test/accuracy

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_best_hybrid-cifar10

early_terminate:
  type: hyperband
  min_iter: 50
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/cifar10-gatedgcn-best-hybrid.yaml
  - --molecular=false
  - --seed=0
  - ${args}

parameters:
  hybrid_num_attn_heads:
    values: [1, 2, 4]
  hybrid_num_gnn_heads:
    values: [1, 2, 4]
  hybrid_gnn_types:
    values:
      - GATEDGCN
      - "GATEDGCN,GATEDGCN"
      - "GATEDGCN,GCN"
      - "GATEDGCN,GIN"
      - "GATEDGCN,GATEDGCN,GATEDGCN,GATEDGCN"
      - "GATEDGCN,GCN,GATEDGCN,GCN"
  hybrid_d_h:
    values: [32, 64, 96, 128]
  hybrid_layers_mp:
    values: [8, 10, 12]
  hybrid_attn_dropout:
    values: [0.0, 0.1, 0.2, 0.3]
  hybrid_mp_dropout:
    values: [0.1, 0.15, 0.2]
  hybrid_attn_mask:
    values: [full, graph_restricted]
  hybrid_gate:
    values: [headwise, elementwise]
  hybrid_norm:
    values: [layernorm, rmsnorm]
  optim.base_lr:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.003
