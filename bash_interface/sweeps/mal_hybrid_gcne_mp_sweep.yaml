# MalNet-Tiny hybrid sweep: every MP preset includes GCNE (fair vs gcn/mal.yaml).
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/mal_hybrid_gcne_mp_sweep.yaml

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: test/accuracy

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_hybriddgatedGNN-mal-gcne-mp

early_terminate:
  type: hyperband
  min_iter: 40
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/mal-gcne-best-hybrid.yaml
  - --molecular=false
  - --seed=0
  - ${args}

parameters:
  hybrid_num_attn_heads:
    values: [2, 4]
  hybrid_num_gnn_heads:
    values: [2, 4]
  hybrid_d_h:
    values: [64, 90, 110]
  hybrid_attn_dropout:
    values: [0.1, 0.2]
  hybrid_mp_dropout:
    values: [0.0, 0.05, 0.1]
  hybrid_attn_mask:
    values: [full, graph_restricted]
  hybrid_gate:
    values: [elementwise, headwise]
  hybrid_norm:
    values: [layernorm, rmsnorm]
  hybrid_gnn_types:
    values:
      - "GCNE,GCNE"
      - "GCNE,GINE"
      - "GCNE,GCN"
      - "GCNE,GIN"
      - "GCNE,GCNE,GCNE,GCNE"
      - "GCNE,GINE,GCNE,GINE"
