# Peptides-func repro sweep: baseline gcne vs hybrid (1 GCNE + 1 attn) at d_h=128.
# For d_h grid {128,192,275} use peptides_func_repro_gcne_dh_sweep.yaml instead.
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/peptides_func_repro_baseline_vs_attn_sweep.yaml
# Launch:
#   SWEEP_ID=... SWEEP_DATASET=peptides_func RUNS_PER_AGENT=2 \
#     sbatch --array=1-1 --time=96:00:00 ... run_wandb_sweep_agent.sh

program: bash_interface/sweeps/sweep_wrapper_gnnplus_repro.sh
method: grid
metric:
  goal: maximize
  name: test/ap

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_repro-peptides_func-gcn-baseline-vs-attn1

command:
  - ${env}
  - bash
  - ${program}
  - --dataset=peptides_func
  - ${args}

parameters:
  repro_variant:
    values: [baseline, hybrid_attn1]
