# Peptides-func gated hybrid sweep (GCN MP family, zc371e1n / a0g1 lineage).
#
# Optimize **validation** metric (not test):
#   metric: best/val_ap  (peptides-func is multilabel AP; there is no val_mae)
#
# Swept (6): lr, max_epoch, num MP heads, num attn heads, d_h, gate
# Fixed MP type: GCN (parse_hybrid_gnn_types duplicates to num_gnn_heads)
# Fixed: rmsnorm, mp_dropout=0.2, attn_dropout=0.1, graph_restricted mask
#
# Create + launch (cluster login):
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/peptides_func_hybrid_gated_mp_sweep.yaml
#   SWEEP_SLURM_TIME=240:00:00 SWEEP_ARRAY_TASKS=16 SWEEP_ARRAY_PARALLEL=4 RUNS_PER_AGENT=3 \
#     bash bash_interface/sweeps/relaunch_sweep_agents.sh \
#       peptides_func weber-geoml-harvard-university/GNNPlus/<SWEEP_ID>

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: best/val_ap

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_hybrid_gated-peptides_func-GCN-val_ap

early_terminate:
  type: hyperband
  min_iter: 80
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/peptides-func-hybrid-zc371e1n-a0g1-anchor.yaml
  - --molecular=true
  - --seed=2
  - ${args}

parameters:
  hybrid_gnn_types:
    value: GCN
  hybrid_num_gnn_heads:
    values: [1, 2, 3]
  hybrid_num_attn_heads:
    values: [0, 1, 2]
  optim.base_lr:
    distribution: log_uniform_values
    min: 0.00015
    max: 0.0015
  hybrid_max_epoch:
    values: [600, 900, 1200]
  hybrid_d_h:
    values: [32, 64, 128]
  hybrid_gate:
    values: [elementwise, headwise]
  hybrid_norm:
    value: rmsnorm
  hybrid_mp_dropout:
    value: 0.2
  hybrid_attn_dropout:
    value: 0.1
  hybrid_attn_mask:
    value: graph_restricted
