# Peptides-func hybrid sweep: every MP expert preset includes GCN.
# Motivation: GCN+ is the strongest classic GNN+ baseline on peptides-functional.
#
# Requires --molecular=true (GINE / bond encoders). Metric: test/ap (maximize).
#
# Create + launch (cluster login node):
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/peptides_func_hybrid_gcn_mp_sweep.yaml
#   SWEEP_ARRAY_TASKS=8 SWEEP_ARRAY_PARALLEL=4 RUNS_PER_AGENT=4 \
#     bash bash_interface/sweeps/relaunch_sweep_agents.sh \
#       peptides_func weber-geoml-harvard-university/GNNPlus/<SWEEP_ID>

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: test/ap

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_hybriddgatedGNN-peptides_func-gcn-mp

early_terminate:
  type: hyperband
  min_iter: 15
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/peptides-func.yaml
  - --molecular=true
  - ${args}

parameters:
  hybrid_num_attn_heads:
    values: [2, 4, 8]
  hybrid_num_gnn_heads:
    values: [2, 4]
  hybrid_d_h:
    values: [8, 16, 32, 64]
  hybrid_attn_dropout:
    values: [0.1, 0.2, 0.5]
  hybrid_attn_mask:
    values: [full, graph_restricted]
  hybrid_gate:
    values: [elementwise, headwise]
  hybrid_norm:
    values: [layernorm, rmsnorm]
  hybrid_gnn_types:
    values:
      - "GCN,GCN"
      - "GCN,GINE"
      - "GCN,GIN"
      - "GCN,SAGE"
      - "GCN,GAT"
      - "GCN,GATEDGCN"
      - "GCN,GATEDGRAPH"
      - "GCN,GGNN"
      - "GCN,GCN,GCN,GCN"
      - "GCN,GINE,GCN,GINE"
      - "GCN,GINE,GIN,SAGE"
      - "GCN,GIN,GCN,GIN"
      - "GCN,SAGE,GCN,SAGE"
      - "GCN,GATEDGCN,GCN,GINE"
      - "GCN,GCN,GINE,GINE"
