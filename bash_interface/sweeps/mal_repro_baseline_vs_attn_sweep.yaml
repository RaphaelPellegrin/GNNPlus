# MalNet-Tiny fair repro: gcne baseline vs 1×GCNE MP + 1×attention (paper seeds 0–4).
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/mal_repro_baseline_vs_attn_sweep.yaml
# Launch:
#   SWEEP_ID=... SWEEP_DATASET=mal RUNS_PER_AGENT=10 \
#     sbatch --array=1-1 --mem=64GB --time=120:00:00 \
#     --export=ALL,SWEEP_ID,SWEEP_DATASET=mal,RUNS_PER_AGENT=10,ENV_NAME=gnnplus \
#     bash_interface/sweeps/run_wandb_sweep_agent.sh

program: bash_interface/sweeps/sweep_wrapper_gnnplus_repro.sh
method: grid
metric:
  goal: maximize
  name: test/accuracy

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_repro-mal-gcne-baseline-vs-attn1

command:
  - ${env}
  - bash
  - ${program}
  - --dataset=mal
  - ${args}

parameters:
  repro_variant:
    values: [baseline, hybrid_attn1]
  seed:
    values: [0, 1, 2, 3, 4]
