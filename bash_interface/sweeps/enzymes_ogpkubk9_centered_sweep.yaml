# W&B Bayesian sweep centered on Heterogeneity_Profile best ENZYMES HybridGated
# https://wandb.ai/weber-geoml-harvard-university/MOE_6/runs/ogpkubk9
#
# Fixed (from ogpkubk9): L12, H64, GCN,GIN,SAGE,GAT, headwise, LN, full attn,
#   residual+FFN, plateau, wd=0, bs=64, random 50/25/25.
#
# Swept (around the center):
#   optim.base_lr              (center 1e-3)
#   gnn.hybrid.num_attn_heads  (center 4)  — each head has a gate
#   gnn.hybrid.num_gnn_heads   (center 4)
#   gnn.hybrid.d_h             (center 16)
#
# Create + agents:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/enzymes_ogpkubk9_centered_sweep.yaml
#   # then follow printed sbatch agent command

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: best_test_perf

entity: weber-geoml-harvard-university
project: GNNPlus
name: enzymes_ogpkubk9_centered_lr_heads_dh

early_terminate:
  type: hyperband
  min_iter: 30
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/enzymes-hybrid-ogpkubk9-a4g4-plateau-anchor.yaml
  - --molecular=false
  - ${args}

parameters:
  # Keep the ogpkubk9 MP type quartet; wrapper expands/truncates to num_gnn_heads.
  hybrid_gnn_types:
    value: "GCN,GIN,SAGE,GAT"

  base_lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.005

  hybrid_num_attn_heads:
    values: [2, 4, 6, 8]

  hybrid_num_gnn_heads:
    values: [2, 4, 6, 8]

  hybrid_d_h:
    values: [8, 16, 32, 64]
