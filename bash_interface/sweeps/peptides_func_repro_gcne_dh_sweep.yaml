# Peptides-func fair repro × d_h: baseline gcne vs hybrid (1 GCNE + 1 attn).
# GCNE MP uses full GCNConvLayer. Grid: 2 variants × 3 d_h = 6 trials.
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/peptides_func_repro_gcne_dh_sweep.yaml
# Launch:
#   SWEEP_ID=... SWEEP_DATASET=peptides_func RUNS_PER_AGENT=6 \
#     sbatch --array=1-1 --mem=64GB --time=120:00:00 ... run_wandb_sweep_agent.sh

program: bash_interface/sweeps/sweep_wrapper_gnnplus_repro.sh
method: grid
metric:
  goal: maximize
  name: test/ap

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_repro-peptides_func-gcn-dh

command:
  - ${env}
  - bash
  - ${program}
  - --dataset=peptides_func
  - ${args}

parameters:
  repro_variant:
    values: [baseline, hybrid_attn1]
  hybrid_d_h:
    values: [128, 192, 275]
