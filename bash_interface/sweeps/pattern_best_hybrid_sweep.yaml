# PATTERN best-hybrid Bayes — fair GCNE MP (anchor: gcn/pattern.yaml).
# Base: configs/gated_hybrid/pattern-gcne-best-hybrid.yaml
# TODO: narrow d_h / LR after standard gcne/gine/gatedgcn baselines finish.
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/pattern_best_hybrid_sweep.yaml
# Launch (128GB; long node-level graphs):
#   SWEEP_ARRAY_TASKS=8 SWEEP_ARRAY_PARALLEL=4 RUNS_PER_AGENT=4 \
#     SWEEP_SLURM_MEM=128GB SWEEP_SLURM_TIME=120:00:00 \
#     bash bash_interface/sweeps/relaunch_sweep_agents.sh \
#       pattern weber-geoml-harvard-university/GNNPlus/<SWEEP_ID>

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: maximize
  name: test/accuracy-SBM

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_best_hybrid-pattern

early_terminate:
  type: hyperband
  min_iter: 50
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/pattern-gcne-best-hybrid.yaml
  - --molecular=false
  - --seed=0
  - ${args}

parameters:
  hybrid_num_attn_heads:
    values: [0, 1, 2]
  hybrid_num_gnn_heads:
    values: [1, 2]
  hybrid_gnn_types:
    values:
      - GCNE
      - "GCNE,GCNE"
      - "GCNE,GINE"
      - "GCNE,GCN"
  hybrid_d_h:
    values: [32, 64, 90]
  hybrid_attn_dropout:
    values: [0.0, 0.1, 0.2]
  hybrid_mp_dropout:
    values: [0.05, 0.1, 0.15]
  hybrid_attn_mask:
    values: [full, graph_restricted]
  hybrid_gate:
    values: [headwise, elementwise]
  hybrid_norm:
    values: [layernorm, rmsnorm]
  optim.base_lr:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.003
