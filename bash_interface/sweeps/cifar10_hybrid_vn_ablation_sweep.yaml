# CIFAR10 virtual-node ablation — grid on anchor t8prvgqr (4 trials).
# num_virtual_nodes=0 → no VN; {1,2,4} auto-enables dataset.add_virtual_nodes.
#
# Create:
#   bash bash_interface/sweeps/create_sweep.sh \
#     bash_interface/sweeps/cifar10_hybrid_vn_ablation_sweep.yaml
# Launch:
#   SWEEP_ARRAY_TASKS=4 SWEEP_ARRAY_PARALLEL=4 RUNS_PER_AGENT=1 \
#     bash bash_interface/sweeps/relaunch_sweep_agents.sh \
#       cifar10 weber-geoml-harvard-university/GNNPlus/<SWEEP_ID>
#
# Prefer SLURM array (no sweep id): submit_cifar10_hybrid_vn_ablation.sh

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: grid
metric:
  goal: maximize
  name: test/accuracy

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_ablation-cifar10-hybrid-vn

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/cifar10-hybrid-t8prvgqr-anchor.yaml
  - --molecular=false
  - --seed=0
  - ${args}

parameters:
  num_virtual_nodes:
    values: [0, 1, 2, 4]
