# Superpixel (COCO-SP, VOC-SP) — smaller batch + capped attn heads (GPU memory).
#
#   hybrid_num_attn_heads: 2, 4  (no 8 — full attention OOMs on 140GB GPU)
#   train.batch_size:      4, 8 (swept; yaml default 4)

program: bash_interface/sweeps/sweep_wrapper_gnnplus.sh
method: bayes
metric:
  goal: __METRIC_GOAL__
  name: __METRIC_NAME__

entity: weber-geoml-harvard-university
project: GNNPlus
name: GNNplus_hybriddgatedGNN-__DATASET_SLUG__

early_terminate:
  type: hyperband
  min_iter: 15
  eta: 3
  s: 2

command:
  - ${env}
  - bash
  - ${program}
  - --cfg=configs/gated_hybrid/__DATASET_CFG__.yaml
  - --molecular=__MOLECULAR__
  - ${args}

parameters:
  batch_size:
    values: [4, 8]
  hybrid_num_attn_heads:
    values: [2, 4]
  hybrid_num_gnn_heads:
    values: [2, 4, 8]
  hybrid_d_h:
    values: [8, 16, 32, 64]
  hybrid_attn_dropout:
    values: [0.1, 0.2, 0.5]
  hybrid_attn_mask:
    values: [graph_restricted, full]
  hybrid_gate:
    values: [elementwise, headwise]
  hybrid_norm:
    values: [layernorm, rmsnorm]
__GNN_TYPES_BLOCK__
