# Lints the repository with ruff (rules configured in pyproject.toml).

name: ruff

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff (lint extra)
        run: |
          python -m pip install --upgrade pip
          pip install ".[lint]"

      - name: Analysing the code with ruff
        run: |
          ruff check --output-format=github .
