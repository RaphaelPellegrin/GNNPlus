[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GNNPlus"
version = "1.2.0"
description = "GraphGym extensions for SiGMA / hybrid GNNs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5.3",
    "networkx>=3.0",
    "numpy>=1.23.1",
    "einops>=0.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# Everything `main.py` imports, except torch itself (keep the preinstalled
# CUDA build, e.g. on Google Colab). torch_scatter is optional: see
# GNNPlus/scatter_compat.py.
colab = [
    "torch_geometric>=2.3",
    "yacs",
    "ogb",
    "scikit-learn",
    "torchmetrics",
    "pandas",
    "wandb",
    "rdkit",
    "joblib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["GNNPlus*"]
