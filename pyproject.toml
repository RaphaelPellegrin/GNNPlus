[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GNNPlus"
version = "1.2.0"
description = "GraphGym extensions for SiGMA / hybrid GNNs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5.3",
    "networkx>=3.0",
    "numpy>=1.23.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["GNNPlus*"]
