[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GNNPlus"
version = "1.2.0"
description = "GraphGym extensions for SiGMA / hybrid GNNs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5.3",
    "networkx>=3.0",
    "numpy>=1.23.1",
    "einops>=0.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# torch and torch-scatter are installed separately (CPU/CUDA wheel indexes).
test = [
    "torch_geometric>=2.3",
    "yacs",
    "ogb",
    "rdkit",
    "scikit-learn",
    "torchmetrics",
    "pandas",
    "tqdm",
    "joblib",
    "pytest",
    "pytest-cov",
]
lint = ["ruff"]

[tool.ruff.lint]
# Pinned explicitly: newer ruff releases widen the default rule set.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["GNNPlus*"]
